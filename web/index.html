<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C&amp;I / Telecom FEED M/H Calculator V.0.4</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app-title">
  <span>C&amp;I / Telecom FEED M/H Calculator V.0.4 / 2026-08-11</span>
  <span class="ver">HYUNDAI ENGINEERING</span>
</div>

<div class="app-body">

  <!-- ================= MASTER CONTROL ================= -->
  <aside class="master">
    <img id="logo" class="logo" alt="HYUNDAI ENGINEERING">
    <h2>MASTER CONTROL</h2>
    <p class="hint">왼쪽 Master 값을 기준으로 Input 공통항목과 Output이 자동 연동됩니다.</p>

    <label for="mc-part">Part</label>
    <select id="mc-part">
      <option>전체</option><option>CI (계장)</option><option>TEL (통신)</option>
    </select>

    <label for="mc-case">Case</label>
    <select id="mc-case">
      <option>외주-단종</option><option>외주-종합</option>
    </select>

    <label for="mc-ratio">비율 적용 방식</label>
    <select id="mc-ratio">
      <option>원본 기준</option><option>사용자 입력</option>
    </select>

    <label for="mc-external">외주최소화</label>
    <select id="mc-external">
      <option>No</option><option>Yes</option>
    </select>

    <label for="mc-project">Project</label>
    <input type="text" id="mc-project">

    <label for="mc-base">Base M/H per 1 M/M</label>
    <input type="text" id="mc-base" inputmode="decimal">

    <label for="mc-months">설계기간 개월</label>
    <input type="text" id="mc-months" inputmode="decimal">

    <label for="mc-rate-short">외주-단종 단가</label>
    <input type="text" id="mc-rate-short" inputmode="decimal">

    <label for="mc-rate-comp">외주-종합 단가</label>
    <input type="text" id="mc-rate-comp" inputmode="decimal">

    <label for="mc-ip">내부 %</label>
    <input type="text" id="mc-ip" inputmode="decimal">

    <label for="mc-ep">외부 %</label>
    <input type="text" id="mc-ep" inputmode="decimal">

    <button class="btn accent gap" id="btn-recalc">Output 재계산</button>
    <button class="btn accent" id="btn-save">입력값 저장</button>
    <button class="btn accent" id="btn-load">저장값 불러오기</button>
    <button class="btn" id="btn-export">입력값 내보내기</button>
    <button class="btn" id="btn-import">입력값 가져오기</button>
    <input type="file" id="file-import" accept=".json,application/json" hidden>
    <button class="btn" id="btn-reset">초기화</button>
    <button class="btn accent gap" id="btn-report">Word Report 생성</button>
    <button class="btn" id="btn-print">현재 탭 인쇄 / PDF 저장</button>

    <p class="note">외주최소화는 왼쪽 Master Control에서만 변경합니다. Input 수정 탭의 파란색 Master연동 행은 왼쪽 값이 그대로 표시됩니다. 초록색 자동결과는 선택값에 따라 즉시 계산되어 표시됩니다.</p>
  </aside>

  <!-- ================= TABS ================= -->
  <main class="pane">
    <div class="tabbar" id="tabbar" role="tablist"></div>
    <div class="tabpanels" id="tabpanels">
      <section class="tabpanel" id="tab-input"></section>
      <section class="tabpanel" id="tab-guide"></section>
      <section class="tabpanel" id="tab-summary"></section>
      <section class="tabpanel" id="tab-output-ci"></section>
      <section class="tabpanel" id="tab-output-tel"></section>
      <section class="tabpanel" id="tab-op1"></section>
      <section class="tabpanel" id="tab-op2-short"></section>
      <section class="tabpanel" id="tab-op2-comp"></section>
      <section class="tabpanel" id="tab-std-ci"></section>
      <section class="tabpanel" id="tab-std-tel"></section>
    </div>
  </main>

</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/model.js"></script>
<script src="js/report.js"></script>
<script src="js/app.js"></script>
</body>
</html>
